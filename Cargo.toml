[package]
name = "bevy_state"
version = "0.19.0-dev"
publish = false
edition = "2024"
description = "Finite state machines for Bevy"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
default = ["std", "bevy_reflect", "bevy_app"]

# Functionality

## Adds runtime reflection support using `bevy_reflect`.
bevy_reflect = [
  "dep:bevy_reflect",
  "bevy_ecs/bevy_reflect",
  "bevy_app?/bevy_reflect",
]

## Adds integration with the `bevy_app` plugin API.
bevy_app = ["dep:bevy_app"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "bevy_ecs/std",
  "bevy_reflect?/std",
  "bevy_app?/std",
  "bevy_platform/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "bevy_ecs/critical-section",
  "bevy_app?/critical-section",
  "bevy_reflect?/critical-section",
  "bevy_platform/critical-section",
]

[dependencies]
# bevy
bevy_ecs = { path = "../bevy_ecs", version = "0.19.0-dev", default-features = false }
bevy_state_macros = { path = "macros", version = "0.19.0-dev" }
bevy_utils = { path = "../bevy_utils", version = "0.19.0-dev", default-features = false }
bevy_reflect = { path = "../bevy_reflect", version = "0.19.0-dev", default-features = false, optional = true }
bevy_app = { path = "../bevy_app", version = "0.19.0-dev", default-features = false, optional = true }
bevy_platform = { path = "../bevy_platform", version = "0.19.0-dev", default-features = false }
variadics_please = "1.1"

# other
log = { version = "0.4", default-features = false }

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"
print_stderr = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"


[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options"]
all-features = true

